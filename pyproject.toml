[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripledger-personal-copilot"
version = "0.2.0"
description = "Personal travel receipts, budget-aware review and conversational analytics."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pankaj Kumar"}]
readme = "README.md"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5", "pydantic-settings==2.15.0", "httpx==0.28.1", "langgraph==1.2.11"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7", "build==1.6.1"]

[project.scripts]
tripledger = "expense_ai_copilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expense_ai_copilot = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
